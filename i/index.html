
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datepicker UI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="datepicker">

        <!-- Date Input -->
        <div class="date-input">
            <input type="text" placeholder="dd / mm / yyyy">

            <button class="calendar-button" aria-label="Open calendar">
                <svg width="20" height="20" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round">
                    <rect x="3" y="5" width="18" height="16" rx="2"/>
                    <path d="M16 3v4M8 3v4M3 10h18"/>
                </svg>
            </button>
        </div>

        <!-- Calendar Dropdown -->
        <div class="calendar">

            <!-- Calendar Header -->
            <div class="calendar-header">

                <button class="nav-button" aria-label="Previous month">
                    &#10094;
                </button>

                <h3>November 2026</h3>

                <button class="nav-button" aria-label="Next month">
                    &#10095;
                </button>

            </div>

            <!-- Day Names -->
            <div class="calendar-days">
                <span>Sun</span>
                <span>Mon</span>
                <span>Tue</span>
                <span>Wed</span>
                <span>Thu</span>
                <span>Fri</span>
                <span>Sat</span>
            </div>

            <!-- Calendar Dates -->
            <div class="calendar-dates">

                <!-- October -->
                <span class="muted">25</span>
                <span class="muted">26</span>
                <span class="muted">27</span>
                <span class="muted">28</span>
                <span class="muted">29</span>
                <span class="muted">30</span>
                <span class="muted">31</span>

                <!-- November -->
                <span>1</span>
                <span>2</span>
                <span>3</span>
                <span>4</span>
                <span>5</span>
                <span>6</span>
                <span>7</span>

                <span>8</span>
                <span>9</span>
                <span>10</span>
                <span>11</span>
                <span>12</span>
                <span>13</span>
                <span>14</span>

                <span>15</span>
                <span>16</span>
                <span>17</span>
                <span>18</span>
                <span class="active">19</span>
                <span>20</span>
                <span>21</span>

                <span>22</span>
                <span>23</span>
                <span>24</span>
                <span>25</span>
                <span>26</span>
                <span>27</span>
                <span>28</span>

                <span>29</span>
                <span>30</span>

                <!-- December -->
                <span class="muted">1</span>
                <span class="muted">2</span>
                <span class="muted">3</span>
                <span class="muted">4</span>
                <span class="muted">5</span>

            </div>

        </div>
    </div>

</body>
</html>
